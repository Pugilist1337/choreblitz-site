<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChoreBlitz</title>
<meta name="description" content="ChoreBlitz — share the housework, fairly.">
<style>
  :root { --bg: #FAF7F0; --fg: #1F2328; --muted: #57606A; --accent: #0A84C6; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161A; --fg: #E6E8EB; --muted: #9AA4AF; --accent: #5CC2FF; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 1.25rem; }
  h1 { font-size: 2.2rem; margin: 0 0 .3rem; }
  p { margin: .3rem 0; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ChoreBlitz</h1>
  <p>Share the housework, fairly.</p>
  <p><a href="/privacy/">Privacy Policy</a> · <a href="mailto:support@choreblitz.com">support@choreblitz.com</a></p>
</main>
</body>
</html>
